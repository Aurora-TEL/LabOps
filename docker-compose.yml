services:
  postgres:
    image: postgres:16
    container_name: labops-postgres
    environment:
      POSTGRES_DB: labops
      POSTGRES_USER: labops
      POSTGRES_PASSWORD: labops_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U labops -d labops"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
